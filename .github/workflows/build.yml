
name: Build VAB from ZIP

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        run: |
          ZIP=$(find . -maxdepth 5 -type f -iname "VanillaAnarchyBridge*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "::error::VAB ZIP archive not found"
            exit 1
          fi

          echo "Found archive: $ZIP"
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

      - name: Extract project
        run: |
          mkdir -p project
          unzip "$ZIP_PATH" -d project

      - name: Locate Gradle project
        run: |
          DIR=$(find project -type f -name build.gradle -o -name build.gradle.kts | head -n 1)

          if [ -z "$DIR" ]; then
            echo "::error::Gradle build file not found"
            find project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$DIR")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project located: $PROJECT_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build project
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.10.2
          fi

          chmod +x gradlew
          ./gradlew --version
          ./gradlew clean build

      - name: Find and verify mod JAR
        run: |
          cd "$PROJECT_DIR"

          echo "Available JARs:"
          find build -type f -name "*.jar" -size +1k

          FOUND=""

          while IFS= read -r JAR; do
            if jar tf "$JAR" | grep -q 'VABClient.class' &&
               jar tf "$JAR" | grep -q 'BridgeLog.class' &&
               jar tf "$JAR" | grep -q 'fabric.mod.json'; then
              FOUND="$JAR"
              break
            fi
          done < <(find build -type f -name "*.jar" ! -name "*sources*" ! -name "*dev*" -size +1k)

          if [ -z "$FOUND" ]; then
            echo "::error::Valid mod JAR was not found"
            exit 1
          fi

          echo "Verified: $FOUND"

          mkdir -p "$GITHUB_WORKSPACE/artifact"
          cp "$FOUND" "$GITHUB_WORKSPACE/artifact/VanillaAnarchyBridge.jar"

      - name: Upload final mod
        uses: actions/upload-artifact@v4
        with:
          name: VanillaAnarchyBridge
          path: artifact/VanillaAnarchyBridge.jar
          if-no-files-found: error
