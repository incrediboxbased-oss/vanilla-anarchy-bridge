
name: Build VAB from ZIP

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 3 -iname "VanillaAnarchyBridge.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Project ZIP not found!"
            exit 1
          fi
          mkdir project
          unzip "$ZIP" -d project

      - name: Locate project
        run: |
          DIR=$(find project -name build.gradle -printf '%h\n' | head -n 1)
          if [ -z "$DIR" ]; then
            echo "build.gradle not found!"
            exit 1
          fi
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build mod
        run: |
          cd "$PROJECT_DIR"
          gradle clean build

      - name: Inspect build
        run: |
          cd "$PROJECT_DIR"
          echo "All JAR files:"
          find build -type f -name '*.jar' -print
          echo "Build directories:"
          find build -maxdepth 4 -type d
          echo "Compiled classes:"
          find build/classes -type f
          echo "Resources:"
          find build/resources -type f
          echo "JAR contents:"
          for JAR in build/libs/*.jar; do
            echo "===== $JAR ====="
            jar tf "$JAR"
          done
      - name: Verify JAR
        run: |
          cd "$PROJECT_DIR"
          JAR="build/libs/vanilla-anarchy-bridge-0.1.0.jar"
          jar tf "$JAR" | grep -q 'VABClient.class'
          jar tf "$JAR" | grep -q 'BridgeLog.class'
          jar tf "$JAR" | grep -q 'fabric.mod.json'
          echo "JAR verification successful!"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: VanillaAnarchyBridge
          path: ${{ env.PROJECT_DIR }}/build/libs/vanilla-anarchy-bridge-0.1.0.jar
